name: CI

on:
  # 只在分支推送时运行：推送 v* 标签时由发布流程（release.yml）调用，不必再单独跑一遍
  push:
    branches: ['**']
  pull_request:
  # 发布流程（release.yml）先调用本工作流跑测试，通过后才构建发布包
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triphub
          POSTGRES_PASSWORD: triphub
          POSTGRES_DB: triphub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triphub" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 不用 go-version-file：go.mod 中带补丁号的 go 版本会被当成精确版本，装上缺少安全修复的旧工具链
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...
        env:
          TRIPHUB_TEST_DSN: postgres://triphub:triphub@localhost:5432/triphub_test?sslmode=disable
      # 用 go run 让当前工具链编译 govulncheck（预编译的旧版本读不了新版标准库）
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
